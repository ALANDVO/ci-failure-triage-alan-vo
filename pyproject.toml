[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-triage-alan-vo"
version = "1.0.1"
description = "Evidence-backed CI failure grouping, flakiness candidates and auditable triage"
requires-python = ">=3.11"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
license = {text = "MIT"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.txt"]}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
